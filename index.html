<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasir Warung - Catatan QRIS</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      onAuthStateChanged, 
      signOut 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      getDocs, 
      deleteDoc, 
      doc, 
      query, 
      orderBy, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCk6FsjLCD-5a04R3Z28LFC8Z7GJAI6jgU",
      authDomain: "anthengku.firebaseapp.com",
      projectId: "anthengku",
      storageBucket: "anthengku.firebasestorage.app",
      messagingSenderId: "866501661876",
      appId: "1:866501661876:web:9e0c3485f8edf08d78f3e1"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;

    onAuthStateChanged(auth, (user) => {
      const loginSection = document.getElementById('login-section');
      const appSection = document.getElementById('app-section');

      if (user) {
        currentUser = user;
        loginSection.classList.add('hidden');
        appSection.classList.remove('hidden');
        document.getElementById('user-email').innerText = user.email;
        loadDashboard(); // Otomatis muat data saat login
      } else {
        currentUser = null;
        loginSection.classList.remove('hidden');
        appSection.classList.add('hidden');
      }
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = e.target.email.value.trim();
      const password = e.target.password.value.trim();
      const errEl = document.getElementById('login-error');
      const loginBtn = document.getElementById('login-btn');

      errEl.innerText = '';
      loginBtn.disabled = true;
      loginBtn.innerText = 'Memproses...';

      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        errEl.innerText = 'Login gagal: Email atau Password salah.';
      } finally {
        loginBtn.disabled = false;
        loginBtn.innerText = 'Masuk';
      }
    });

    window.handleLogout = () => signOut(auth);

    window.switchTab = (tabName) => {
      const inputView = document.getElementById('input-view');
      const dashboardView = document.getElementById('dashboard-view');
      const tabInputBtn = document.getElementById('tab-input-btn');
      const tabDashboardBtn = document.getElementById('tab-dashboard-btn');

      if (tabName === 'input') {
        inputView.classList.remove('hidden');
        dashboardView.classList.add('hidden');
        tabInputBtn.className = "flex-1 py-2 text-xs font-bold rounded-lg bg-blue-600 text-white shadow-sm transition";
        tabDashboardBtn.className = "flex-1 py-2 text-xs font-bold rounded-lg text-slate-600 hover:bg-slate-100 transition";
      } else {
        inputView.classList.add('hidden');
        dashboardView.classList.remove('hidden');
        tabDashboardBtn.className = "flex-1 py-2 text-xs font-bold rounded-lg bg-blue-600 text-white shadow-sm transition";
        tabInputBtn.className = "flex-1 py-2 text-xs font-bold rounded-lg text-slate-600 hover:bg-slate-100 transition";
        loadDashboard(); 
      }
    };

    document.getElementById('qris-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submit-btn');
      const statusMsg = document.getElementById('status-msg');
      statusMsg.innerText = '';

      const nominal = parseFloat(document.getElementById('nominal').value) || 0;

      if (nominal <= 0) {
        alert('Nominal transaksi QRIS harus lebih besar dari 0!');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = 'Menyimpan ke Database...';

      const now = new Date();
      const jamWaktu = now.toTimeString().split(' ')[0];

      try {
        await addDoc(collection(db, "transactions"), {
          tanggal: document.getElementById('tanggal').value,
          waktu: jamWaktu,
          userEmail: currentUser.email,
          nominal: nominal,
          keterangan: document.getElementById('keterangan').value || '-',
          createdAt: serverTimestamp()
        });

        statusMsg.className = "text-emerald-600 font-bold text-center mt-3 p-2 bg-emerald-50 rounded-lg border border-emerald-200";
        statusMsg.innerText = "Transaksi QRIS Berhasil Disimpan!";
        
        document.getElementById('nominal').value = '';
        document.getElementById('keterangan').value = '';
        document.getElementById('nominal').focus();
      } catch (err) {
        console.error(err);
        statusMsg.className = "text-red-600 font-bold text-center mt-3 p-2 bg-red-50 rounded-lg border border-red-200";
        statusMsg.innerText = "Gagal menyimpan transaksi. Periksa koneksi/izin Database.";
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Catat Transaksi QRIS';
      }
    });

    window.loadDashboard = async () => {
      const container = document.getElementById('transaction-list');
      const totalHariIniEl = document.getElementById('total-qris-hari-ini');
      const jumlahTxEl = document.getElementById('jumlah-tx-hari-ini');
      
      container.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-slate-400 text-xs">Memuat data...</td></tr>';

      try {
        const q = query(collection(db, "transactions"), orderBy("createdAt", "desc"));
        const querySnapshot = await getDocs(q);
        
        let totalHariIni = 0;
        let countHariIni = 0;
        const todayStr = new Date().toISOString().split('T')[0];
        let htmlRows = '';

        querySnapshot.forEach((docSnap) => {
          const tx = docSnap.data();
          const docId = docSnap.id;

          if (tx.tanggal === todayStr) {
            totalHariIni += parseFloat(tx.nominal) || 0;
            countHariIni++;
          }

          htmlRows += `
            <tr class="border-b border-slate-100 hover:bg-slate-50">
              <td class="py-2.5 px-2 text-slate-700">
                <div class="font-bold">${tx.waktu || '-'}</div>
                <div class="text-[10px] text-slate-400">${tx.tanggal}</div>
                <div class="text-[10px] text-blue-600 font-medium truncate max-w-[100px]" title="${tx.userEmail || '-'}">👤 ${tx.userEmail || '-'}</div>
              </td>
              <td class="py-2.5 px-2 font-bold text-blue-600">Rp ${Number(tx.nominal).toLocaleString('id-ID')}</td>
              <td class="py-2.5 px-2 text-slate-600 truncate max-w-[90px]">${tx.keterangan || '-'}</td>
              <td class="py-2.5 px-2 text-center">
                <button onclick="deleteTransaction('${docId}')" 
                        class="bg-red-50 hover:bg-red-100 text-red-600 px-2 py-1 rounded-md text-xs transition font-semibold" title="Hapus">
                  🗑️
                </button>
              </td>
            </tr>
          `;
        });

        totalHariIniEl.innerText = `Rp ${Number(totalHariIni).toLocaleString('id-ID')}`;
        jumlahTxEl.innerText = `${countHariIni} Transaksi`;

        if (htmlRows === '') {
          container.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-slate-400 text-xs">Belum ada transaksi tersimpan.</td></tr>';
        } else {
          container.innerHTML = htmlRows;
        }
      } catch (err) {
        console.error(err);
        container.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-red-400 text-xs">Gagal memuat data dari Firestore.</td></tr>';
      }
    };

    window.deleteTransaction = async (docId) => {
      if (confirm("Yakin ingin menghapus transaksi ini?")) {
        try {
          await deleteDoc(doc(db, "transactions", docId));
          loadDashboard();
        } catch (err) {
          alert("Gagal menghapus transaksi.");
          console.error(err);
        }
      }
    };

    document.addEventListener("DOMContentLoaded", () => {
      const tanggalEl = document.getElementById('tanggal');
      if(tanggalEl) tanggalEl.valueAsDate = new Date();
    });
  </script>
</head>
<body class="bg-slate-100 min-h-screen flex justify-center items-center p-3 font-sans">

  <div id="login-section" class="bg-white p-6 rounded-2xl shadow-lg w-full max-w-sm border border-slate-200">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-black text-slate-800">Kasir Anthengku</h1>
      <p class="text-xs text-slate-500 mt-1">Silakan login akun kasir kamu</p>
    </div>

    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider">Email Kasir</label>
        <input type="email" id="email" placeholder="kasir@warung.com" required 
               class="w-full mt-1 p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-slate-800 bg-slate-50">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider">Password</label>
        <input type="password" id="password" placeholder="••••••••" required 
               class="w-full mt-1 p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-slate-800 bg-slate-50">
      </div>
      
      <p id="login-error" class="text-red-500 text-xs font-semibold text-center"></p>

      <button type="submit" id="login-btn" 
              class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition shadow-md active:scale-95">
        Masuk
      </button>
    </form>
  </div>

  <div id="app-section" class="bg-white p-5 rounded-2xl shadow-lg w-full max-w-md border border-slate-200 hidden">
    
    <div class="flex justify-between items-center mb-3 pb-3 border-b border-slate-100">
      <div>
        <h2 class="text-base font-bold text-slate-800">Pencatatan QRIS Warung</h2>
        <p id="user-email" class="text-xs text-slate-400 font-medium"></p>
      </div>
      <button onclick="handleLogout()" 
              class="text-xs bg-red-50 text-red-600 font-semibold px-3 py-1.5 rounded-lg hover:bg-red-100 transition border border-red-100">
        Keluar
      </button>
    </div>

    <div class="flex bg-slate-100 p-1 rounded-xl mb-4">
      <button id="tab-input-btn" onclick="switchTab('input')" class="flex-1 py-2 text-xs font-bold rounded-lg bg-blue-600 text-white shadow-sm transition">
        Input QRIS
      </button>
      <button id="tab-dashboard-btn" onclick="switchTab('dashboard')" class="flex-1 py-2 text-xs font-bold rounded-lg text-slate-600 hover:bg-slate-100 transition">
        Dashboard & Riwayat
      </button>
    </div>

    <div id="input-view">
      <form id="qris-form" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600">Tanggal Transaksi</label>
          <input type="date" id="tanggal" required class="w-full mt-1 p-2.5 border rounded-lg text-xs font-medium bg-slate-50">
        </div>

        <div>
          <label class="block text-xs font-semibold text-blue-600">Nominal QRIS (Rp)</label>
          <input type="number" id="nominal" placeholder="0" required min="1" autofocus
                 class="w-full mt-1 p-2.5 border rounded-lg text-lg font-bold text-blue-700 bg-blue-50/30 focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600">Keterangan</label>
          <textarea id="keterangan" rows="2" placeholder="Contoh: Tukar Cash" 
                    class="w-full mt-1 p-2.5 border rounded-lg text-xs bg-slate-50"></textarea>
        </div>

        <button type="submit" id="submit-btn" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition shadow-md active:scale-95 text-sm mt-2">
          Catat Transaksi QRIS
        </button>
      </form>
      <div id="status-msg"></div>
    </div>

    <div id="dashboard-view" class="hidden space-y-3">
      <div class="grid grid-cols-2 gap-2">
        <div class="bg-blue-50 p-3 rounded-xl border border-blue-100">
          <p class="text-[10px] uppercase font-bold text-blue-600 tracking-wider">Total QRIS Hari Ini</p>
          <h3 id="total-qris-hari-ini" class="text-sm font-black text-blue-800 mt-1">Rp 0</h3>
        </div>
        <div class="bg-emerald-50 p-3 rounded-xl border border-emerald-100">
          <p class="text-[10px] uppercase font-bold text-emerald-600 tracking-wider">Jumlah Transaksi</p>
          <h3 id="jumlah-tx-hari-ini" class="text-sm font-black text-emerald-800 mt-1">0 Transaksi</h3>
        </div>
      </div>

      <div class="flex justify-between items-center pt-2">
        <h4 class="text-xs font-bold text-slate-700">Riwayat Transaksi</h4>
        <button onclick="loadDashboard()" class="text-[10px] bg-slate-100 hover:bg-slate-200 text-slate-600 px-2.5 py-1 rounded-md font-semibold transition">
          🔄
        </button>
      </div>

      <div class="max-h-60 overflow-y-auto border border-slate-200 rounded-xl">
        <table class="w-full text-left text-xs">
          <thead class="bg-slate-50 border-b border-slate-200 text-slate-500 uppercase text-[10px] sticky top-0">
            <tr>
              <th class="py-2 px-2">Waktu & Akun</th>
              <th class="py-2 px-2">Nominal</th>
              <th class="py-2 px-2">Keterangan</th>
              <th class="py-2 px-2 text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="transaction-list">
  
          </tbody>
        </table>
      </div>
    </div>

  </div>

</body>
  </html>
