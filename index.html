<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasir Warung - Input Shift</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Firebase App & Auth SDK v10 (ES Modules) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      onAuthStateChanged, 
      signOut 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // Konfigurasi Firebase Anthengku
    const firebaseConfig = {
      apiKey: "AIzaSyCk6FsjLCD-5a04R3Z28LFC8Z7GJAI6jgU",
      authDomain: "anthengku.firebaseapp.com",
      projectId: "anthengku",
      storageBucket: "anthengku.firebasestorage.app",
      messagingSenderId: "866501661876",
      appId: "1:866501661876:web:9e0c3485f8edf08d78f3e1"
    };

    // URL Web App Google Apps Script
    const GAS_URL = "https://script.google.com/macros/s/AKfycby0TIX62JWOUQFUe1jrk8FbRkVvYDU_LUjpCnFVzVrHk2kOZjK599Jg3pRZJ-PmzFx8/exec";

    // Inisialisasi Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    let currentUser = null;

    // Monitor Status Login User
    onAuthStateChanged(auth, (user) => {
      const loginSection = document.getElementById('login-section');
      const appSection = document.getElementById('app-section');

      if (user) {
        currentUser = user;
        loginSection.classList.add('hidden');
        appSection.classList.remove('hidden');
        document.getElementById('user-email').innerText = user.email;
      } else {
        currentUser = null;
        loginSection.classList.remove('hidden');
        appSection.classList.add('hidden');
      }
    });

    // Handle Form Login
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = e.target.email.value.trim();
      const password = e.target.password.value.trim();
      const errEl = document.getElementById('login-error');
      const loginBtn = document.getElementById('login-btn');

      errEl.innerText = '';
      loginBtn.disabled = true;
      loginBtn.innerText = 'Memproses...';

      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        errEl.innerText = 'Login gagal: Email atau Password salah.';
      } finally {
        loginBtn.disabled = false;
        loginBtn.innerText = 'Masuk';
      }
    });

    // Handle Logout
    window.handleLogout = () => signOut(auth);

    // Handle Form Input Shift
    document.getElementById('shift-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submit-btn');
      const statusMsg = document.getElementById('status-msg');
      
      statusMsg.innerText = '';

      const omzet = parseFloat(document.getElementById('omzet').value) || 0;
      const qris = parseFloat(document.getElementById('qris').value) || 0;
      const tunai = parseFloat(document.getElementById('tunai').value) || 0;
      const pengeluaran = parseFloat(document.getElementById('pengeluaran').value) || 0;

      // Validasi: Omzet = QRIS + Tunai
      if (omzet !== (qris + tunai)) {
        alert('❌ PERHATIAN: Total Omzet harus persis sama dengan jumlah (QRIS + Tunai)! Silakan cek kembali.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = 'Mengirim Data...';

      const payload = {
        tanggal: document.getElementById('tanggal').value,
        shift: document.getElementById('shift').value,
        userEmail: currentUser.email,
        omzet: omzet,
        qris: qris,
        tunai: tunai,
        pengeluaran: pengeluaran,
        catatanPengeluaran: document.getElementById('catatan_pengeluaran').value || '-'
      };

      try {
        // Kirim data ke GAS
        await fetch(GAS_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        statusMsg.className = "text-emerald-600 font-bold text-center mt-3 p-2 bg-emerald-50 rounded-lg border border-emerald-200";
        statusMsg.innerText = "✅ Laporan Shift Berhasil Dikirim!";
        
        // Reset Form
        document.getElementById('shift-form').reset();
        document.getElementById('tanggal').valueAsDate = new Date();
      } catch (err) {
        statusMsg.className = "text-red-600 font-bold text-center mt-3 p-2 bg-red-50 rounded-lg border border-red-200";
        statusMsg.innerText = "❌ Gagal mengirim data. Periksa koneksi internet.";
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Kirim Laporan Shift';
      }
    });

    // Set default tanggal hari ini
    document.getElementById('tanggal').valueAsDate = new Date();
  </script>
</head>
<body class="bg-slate-100 min-h-screen flex justify-center items-center p-3 font-sans">

  <!-- CARD LOGIN -->
  <div id="login-section" class="bg-white p-6 rounded-2xl shadow-lg w-full max-w-sm border border-slate-200">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-black text-slate-800">Kasir Anthengku</h1>
      <p class="text-xs text-slate-500 mt-1">Silakan login akun shift kamu</p>
    </div>

    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider">Email Shift</label>
        <input type="email" id="email" placeholder="shift1@warung.com" required 
               class="w-full mt-1 p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-slate-800 bg-slate-50">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider">Password</label>
        <input type="password" id="password" placeholder="••••••••" required 
               class="w-full mt-1 p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-slate-800 bg-slate-50">
      </div>
      
      <p id="login-error" class="text-red-500 text-xs font-semibold text-center"></p>

      <button type="submit" id="login-btn" 
              class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition shadow-md active:scale-95">
        Masuk
      </button>
    </form>
  </div>

  <!-- CARD FORM INPUT SHIFT -->
  <div id="app-section" class="bg-white p-5 rounded-2xl shadow-lg w-full max-w-md border border-slate-200 hidden">
    
    <!-- Header User -->
    <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-100">
      <div>
        <h2 class="text-base font-bold text-slate-800">Laporan Setoran Shift</h2>
        <p id="user-email" class="text-xs text-slate-400 font-medium"></p>
      </div>
      <button onclick="handleLogout()" 
              class="text-xs bg-red-50 text-red-600 font-semibold px-3 py-1.5 rounded-lg hover:bg-red-100 transition border border-red-100">
        Keluar
      </button>
    </div>

    <!-- Form Transaksi -->
    <form id="shift-form" class="space-y-3">
      
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-semibold text-slate-600">Tanggal</label>
          <input type="date" id="tanggal" required class="w-full mt-1 p-2.5 border rounded-lg text-xs font-medium bg-slate-50">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600">Pilih Shift</label>
          <select id="shift" required class="w-full mt-1 p-2.5 border rounded-lg text-xs font-medium bg-slate-50">
            <option value="Shift 1">Shift 1 (Pagi/Siang)</option>
            <option value="Shift 2">Shift 2 (Sore/Malam)</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600">Total Omzet Shift (Rp)</label>
        <input type="number" id="omzet" placeholder="0" required min="0"
               class="w-full mt-1 p-2.5 border rounded-lg text-base font-bold text-slate-800 bg-slate-50 focus:ring-2 focus:ring-blue-500">
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-semibold text-blue-600">Pembayaran QRIS (Rp)</label>
          <input type="number" id="qris" placeholder="0" required min="0"
                 class="w-full mt-1 p-2.5 border rounded-lg text-sm font-semibold text-blue-700 bg-blue-50/30">
        </div>
        <div>
          <label class="block text-xs font-semibold text-emerald-600">Tunai Diterima (Rp)</label>
          <input type="number" id="tunai" placeholder="0" required min="0"
                 class="w-full mt-1 p-2.5 border rounded-lg text-sm font-semibold text-emerald-700 bg-emerald-50/30">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-rose-600">Pengeluaran Kas Warung (Rp)</label>
        <input type="number" id="pengeluaran" placeholder="0" min="0"
               class="w-full mt-1 p-2.5 border rounded-lg text-sm font-semibold text-rose-700 bg-rose-50/30">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600">Catatan Pengeluaran</label>
        <textarea id="catatan_pengeluaran" rows="2" placeholder="Contoh: Beli es batu 10rb, sedotan 5rb" 
                  class="w-full mt-1 p-2.5 border rounded-lg text-xs bg-slate-50"></textarea>
      </div>

      <button type="submit" id="submit-btn" 
              class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition shadow-md active:scale-95 text-sm mt-2">
        Kirim Laporan Shift
      </button>
    </form>

    <div id="status-msg"></div>
  </div>

</body>
</html>
